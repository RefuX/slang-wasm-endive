plugins {
    id 'java-library'
    // Applied (not used) at the root so the Kotlin module's publish plugin can
    // access Kotlin plugin classes from the shared build classpath.
    id 'org.jetbrains.kotlin.jvm' apply false
    id 'com.vanniktech.maven.publish'
}

group = 'io.github.refux'
version = '0.0.4'

def endiveVersion = '1.0.1'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

sourceSets.main.java.srcDirs += ['src/generated/java']

repositories {
    mavenCentral()
}

// The slang-wasm-wasi.wasm artifact. @WasmModuleInterface reads this at COMPILE
// TIME to generate the typed export/import wrappers (SlangWasm_ModuleExports
// etc.)
def wasmFile = file(project.findProperty('slang.wasm.path')
        ?: System.getenv('SLANG_WASM_PATH')
        ?: "${rootProject.projectDir}/slang-wasm-wasi.wasm")

// Stage only slang-wasm-wasi.wasm into its own directory so the annotation
// processor path holds just that one file. Pointing the processor path at the
// real build/bin directory would make Gradle fingerprint ~400 MB of unrelated
// wasm artifacts on every build.
def stageWasmForAnnotationProcessor = tasks.register('stageWasmForAnnotationProcessor', Sync) {
    doFirst {
        if (!wasmFile.exists()) {
            throw new GradleException(
                    "slang-wasm-wasi.wasm not found at ${wasmFile}\n" +
                    "@WasmModuleInterface reads it at compile time to generate the typed WASM\n" +
                    "bindings, so it must exist before compiling. Build it first with\n" +
                    "  cmake --build --preset slang-wasm-wasi\n" +
                    "or point the build at an existing artifact with -Pslang.wasm.path=... or " +
                    "the SLANG_WASM_PATH environment variable.")
        }
    }
    from(wasmFile)
    into(layout.buildDirectory.dir("wasm-annotation-processor"))
}

// ── Build-time compilation of the WASM to JVM bytecode ──────────────────────
def endiveGeneratedSources = layout.buildDirectory.dir('generated/endive/sources')
def endiveGeneratedClasses = layout.buildDirectory.dir('generated/endive/classes')

configurations {
    endiveBuildTimeCompiler
}

def compileWasmToJvmBytecode = tasks.register('compileWasmToJvmBytecode', JavaExec) {
    description = 'Compiles slang-wasm-wasi.wasm to JVM bytecode with the endive build-time compiler.'
    doFirst {
        if (!wasmFile.exists()) {
            throw new GradleException(
                    "slang-wasm-wasi.wasm not found at ${wasmFile} — see stageWasmForAnnotationProcessor.")
        }
    }
    // inputs.files (not .file) so a missing wasm reaches the friendly doFirst error.
    inputs.files(wasmFile)
    outputs.dir(endiveGeneratedSources)
    outputs.dir(endiveGeneratedClasses)
    classpath = configurations.endiveBuildTimeCompiler
    mainClass = 'run.endive.experimental.compiler.cli.Cli'
    maxHeapSize = '2g'
    jvmArgs '-Xss256m'
    args wasmFile.absolutePath,
            '--prefix', 'io.github.refux.slangwasm.SlangWasmModule',
            '--source-dir', endiveGeneratedSources.get().asFile.absolutePath,
            '--class-dir', endiveGeneratedClasses.get().asFile.absolutePath,
            '--wasm-dir', endiveGeneratedClasses.get().asFile.absolutePath,
            '--interpreter-fallback', 'WARN'
}

// The generated facade is ordinary source; the Machine classes and the .meta
// module are prebuilt classpath entries.
sourceSets.main.java.srcDir(files(endiveGeneratedSources).builtBy(compileWasmToJvmBytecode))
def endiveCompiledModule = files(endiveGeneratedClasses).builtBy(compileWasmToJvmBytecode)

// ── Build-time generation of slang-version.properties ───────────────────────
// SlangVersion.BUILD_TAG must be readable WITHOUT loading the compiler (it keys
// persistent caches that want to skip the ~230 MB runtime load on a hit). The
// only reliable source of the tag is the compiler itself, so run it once at
// build time and bake the result into a resource. Up-to-date-checked on the
// wasm, so it only re-runs when the bundled module changes.
sourceSets {
    // A tiny generator that runs the compiled runtime; compiled against the main
    // classes (see the versionTool* dependencies below) but never shipped in the
    // jar. Its dependencies are declared through the versionToolImplementation
    // configuration rather than by assigning compileClasspath directly, so the
    // IDE models the dependency on main and resolves the imports.
    versionTool
}

def generatedVersionResources = layout.buildDirectory.dir('generated/slang-version/resources')
def generateSlangVersion = tasks.register('generateSlangVersion', JavaExec) {
    description = 'Runs the bundled Slang compiler once and writes its build tag to slang-version.properties.'
    inputs.files(wasmFile)
    outputs.dir(generatedVersionResources)
    classpath = sourceSets.versionTool.runtimeClasspath
    mainClass = 'io.github.refux.slangwasm.versiontool.GenerateSlangVersion'
    maxHeapSize = '2g'
    jvmArgs '-Xss256m'
    args generatedVersionResources.get().asFile.absolutePath
}

// Bake the generated tag into the published jar. It is deliberately NOT added to
// sourceSets.main.resources: the generator's classpath includes the main source
// set output, so feeding the resource back into main.resources would make
// processResources depend on generateSlangVersion and vice versa (a cycle). The
// version guard test gets it via testRuntimeOnly (see dependencies).
jar {
    from(files(generatedVersionResources).builtBy(generateSlangVersion))
}

dependencies {
    // The generator compiles against the main classes (SlangRuntime/SlangCompiler)
    // and runs the bundled compiler, so it needs main's output plus the same
    // endive runtime deps. Declared here (not via a compileClasspath assignment)
    // so IntelliJ resolves the imports.
    versionToolImplementation sourceSets.main.output
    versionToolImplementation "run.endive:runtime:$endiveVersion"
    versionToolImplementation "run.endive:wasi:$endiveVersion"
    versionToolImplementation "run.endive:compiler:$endiveVersion"
    versionToolImplementation "run.endive:dircache-experimental:$endiveVersion"
    versionToolImplementation endiveCompiledModule

    // Put the generated resource on the test runtime classpath so the version
    // guard test can read /slang-version.properties.
    testRuntimeOnly files(generatedVersionResources) { builtBy generateSlangVersion }

    endiveBuildTimeCompiler "run.endive:build-time-compiler-cli-experimental:$endiveVersion"

    // The build-time-compiled Machine classes + .meta module (compile classpath:
    // the generated SlangWasmModule facade references the Machine class).
    implementation endiveCompiledModule

    implementation "run.endive:runtime:$endiveVersion"
    // api: WasiOptions appears on SlangRuntime.Builder's public signature
    // (withWasiOptions), so consumers need it on their compile classpath.
    api "run.endive:wasi:$endiveVersion"
    implementation "run.endive:compiler:$endiveVersion"
    implementation "run.endive:dircache-experimental:$endiveVersion"

    compileOnly "run.endive:annotations:$endiveVersion"
    annotationProcessor "run.endive:annotations-processor:$endiveVersion"
    annotationProcessor files(stageWasmForAnnotationProcessor)

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

jar {
    from endiveCompiledModule
}

tasks.named('compileJava') {
    options.fork = true
    options.forkOptions.memoryMaximumSize = '2g'
}

test {
    useJUnitPlatform()

    maxHeapSize = '2g'
    jvmArgs '-Xss256m'

    systemProperty 'slang.wasm.path', wasmFile.absolutePath
}

// The -javadoc.jar Maven Central requires is generated over the endive-generated
// SlangWasmModule facade and the checked-in enums.* — disable doclint so those
// generated sources can't fail the release build on style/reference lint.
tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
}

// ── Maven Central publishing (com.vanniktech.maven.publish) ─────────────────
mavenPublishing {
    publishToMavenCentral()
    signAllPublications()

    pom {
        name = 'slang-wasm-endive'
        description = 'Pure-JVM library for the Slang shader compiler: compile, reflect on, and ' +
                'serialize Slang shaders with no JNI and no native binary, by running the Slang ' +
                'WASM build in-process on the endive runtime.'
        inceptionYear = '2026'
        url = 'https://github.com/RefuX/slang-wasm-endive'
        licenses {
            license {
                name = 'The Apache License, Version 2.0'
                url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                distribution = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
            }
        }
        developers {
            developer {
                id = 'RefuX'
                name = 'James Roome'
                url = 'https://github.com/RefuX'
            }
        }
        scm {
            url = 'https://github.com/RefuX/slang-wasm-endive'
            connection = 'scm:git:git://github.com/RefuX/slang-wasm-endive.git'
            developerConnection = 'scm:git:ssh://git@github.com/RefuX/slang-wasm-endive.git'
        }
    }
}
